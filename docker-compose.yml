services:
  db:
    image: postgres:16
    container_name: myduka-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: myduka
      POSTGRES_USER: myduka_user
      POSTGRES_PASSWORD: myduka_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: myduka-backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

volumes:
  postgres_data: