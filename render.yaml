databases:
  - name: myduka-db
    plan: free
    databaseName: myduka
    user: myduka_user

services:
  - type: web
    name: myduka-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/auth/health/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: myduka-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false
